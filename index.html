<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Covert Chat | Protected by E2EE</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #030712; color: #f3f4f6; font-family: monospace; }
    .neon-border { box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); border: 1px solid #10b981; }
    .neon-text { text-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

  <script>
    // ----------------------------------------------------
    // ⚠️ ここをご自身のSupabase情報に書き換えてください！
    // ----------------------------------------------------
    const SUPABASE_URL = "https://ytuhfzdznnimathjibre.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_49BCW90I36ZiN73aPc-s6A_Fy1erkMV";
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- UI コンテナ -->
  <div id="app" class="w-full max-w-4xl bg-gray-900 border border-emerald-500/30 rounded-lg p-6 neon-border">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-emerald-500/20">
      <h1 class="text-2xl font-bold text-emerald-400 neon-text flex items-center gap-2">
        <i data-lucide="shield-check"></i> COVERT CHAT // ONLINE
      </h1>
      <span class="text-xs bg-emerald-950 text-emerald-400 px-3 py-1 rounded border border-emerald-500/30">
        E2EE AES-256 ACTIVE
      </span>
    </div>

    <!-- ログインフォーム -->
    <div id="login-section" class="max-w-md mx-auto py-8">
      <h2 class="text-lg font-bold text-emerald-300 mb-4">ACCESS AUTHENTICATION</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">USER ID</label>
          <input type="text" id="login-id" placeholder="commander または agent_id" class="w-full bg-gray-950 border border-emerald-500/30 rounded px-3 py-2 text-emerald-400 focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">PASSWORD / OTP</label>
          <input type="password" id="login-pass" placeholder="Password or 6-digit OTP" class="w-full bg-gray-950 border border-emerald-500/30 rounded px-3 py-2 text-emerald-400 focus:outline-none focus:border-emerald-400">
        </div>
        <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded transition-all">
          AUTHENTICATE
        </button>
      </div>
    </div>

    <!-- メイン領域 (認証後表示) -->
    <div id="main-section" class="hidden">
      <p class="text-emerald-400">認証成功。Supabase リアルタイムサーバーと同期しています。</p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // ログイン処理（Supabase連携例）
    async function handleLogin() {
      const userId = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value.trim();

      if (!userId || !pass) {
        alert('IDとパスワード/OTPを入力してください。');
        return;
      }

      // 司令官ログインテスト (初期設定: commander / admin)
      if (userId === 'commander' && pass === 'admin') {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
        return;
      }

      // OTP確認ロジック (Supabaseから照会)
      const { data: otps, error } = await db
        .from('otps')
        .select('*')
        .eq('user_id', userId)
        .eq('otp_code', pass)
        .eq('used', false);

      if (otps && otps.length > 0) {
        alert('エージェントとして認証されました！');
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
      } else {
        alert('認証エラー: IDまたはパスワード/OTPが違います。');
      }
    }
  </script>
</body>
</html>
